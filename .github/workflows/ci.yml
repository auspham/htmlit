name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check skills/htmlit tests/python

      - name: Test
        run: python -m pytest tests/python

  client:
    name: Browser client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        # The client tests boot the real (Python) daemon to serve the page.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Vendor front-end assets
        # Serve Mermaid and highlight.js locally so the browser tests do not
        # depend on a CDN at runtime. The client would fall back to the CDN if
        # this step were skipped.
        run: python3 skills/htmlit/vendor.py

      - name: Test
        run: npm test
