<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>copilot</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #10151c; --fg: #c9d1d9; --dim: #8b949e; --line: #21262d;
      --user: #d2a8ff; --agent: #7ee787; --accent: #a371f7; --good: #3fb950;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 14.5px; line-height: 1.6; display: flex; flex-direction: column; height: 100vh;
    }
    .bar {
      flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--dim);
    }
    .dots { display: flex; gap: 7px; }
    .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .dots i:nth-child(1) { background: #ff5f56; } .dots i:nth-child(2) { background: #ffbd2e; } .dots i:nth-child(3) { background: #27c93f; }
    .bar .title { color: var(--fg); font-weight: 600; }
    .bar .spacer { flex: 1; }
    .log { flex: 1; overflow-y: auto; padding: 20px 26px 8px; scroll-behavior: auto; }
    .log::-webkit-scrollbar { width: 10px; }
    .log::-webkit-scrollbar-thumb { background: #30363d; border-radius: 8px; }
    .msg { margin: 0 0 18px; max-width: 830px; }
    .who { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
    .who .dot { width: 8px; height: 8px; border-radius: 50%; }
    .msg.user .who { color: var(--user); } .msg.user .who .dot { background: var(--user); }
    .msg.agent .who { color: var(--agent); } .msg.agent .who .dot { background: var(--agent); }
    .msg.user .body { color: #e6edf3; }
    /* The agent prints plain terminal text: no rendered markdown, just monospace
       lines and ASCII, exactly as a CLI agent emits them. */
    .body .raw { margin: 0; font: inherit; color: var(--fg); white-space: pre-wrap; word-break: normal; }
    .body .link { color: #79c0ff; text-decoration: underline; }
    .body .dim { color: var(--dim); }
    .thinking { display: flex; align-items: center; gap: 9px; color: var(--dim); margin: 0 0 18px; }
    .task { display: flex; align-items: center; gap: 10px; margin: 6px 0; color: var(--dim); }
    .task .box { width: 16px; height: 16px; border: 1.5px solid #30363d; border-radius: 4px; display: grid; place-items: center; flex: none; }
    .task.done { color: #e6edf3; } .task.done .box { border-color: var(--good); background: var(--good); }
    .task.done .box::after { content: "\2713"; color: #06120a; font-size: 11px; font-weight: 800; }
    .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid #30363d; border-top-color: var(--agent); border-radius: 50%; animation: sp .7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .inbar { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 13px 20px; display: flex; align-items: center; gap: 10px; }
    .inbar .prompt { color: var(--accent); font-weight: 700; }
    .inbar .field { white-space: pre; color: #e6edf3; }
    .inbar .cur { display: inline-block; width: 8px; height: 17px; background: var(--fg); vertical-align: -3px; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .inbar .spacer { flex: 1; }
    .inbar .hint { color: var(--dim); font-size: 12px; }
    #cap {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none;
      background: rgba(17,18,22,.94); color: #fff; font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 999px; opacity: 0;
      transition: opacity .3s; white-space: nowrap; box-shadow: 0 6px 22px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08);
    }
    #narrative {
      position: fixed; inset: 0; z-index: 60; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 8vw; opacity: 0; transition: opacity .5s;
      background: radial-gradient(130% 130% at 50% 42%, rgba(13,17,23,.92), rgba(13,17,23,.995));
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #narrative .big { color: #fff; font-weight: 750; font-size: 40px; line-height: 1.25; letter-spacing: -.02em; max-width: 900px; }
    #narrative .big .hl { color: var(--accent); }
    #narrative .sub { color: var(--dim); font-size: 20px; line-height: 1.5; margin-top: 18px; max-width: 720px; }
  </style>
</head>
<body>
  <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="title">copilot</span><span class="spacer"></span><span>auth-service &middot; main</span></div>
  <div class="log" id="log"></div>
  <div class="inbar"><span class="prompt">&rsaquo;</span><span class="field" id="field"></span><span class="cur" id="cur"></span><span class="spacer"></span><span class="hint">enter to send</span></div>
  <div id="cap"></div>
  <div id="narrative"><div class="big"></div><div class="sub"></div></div>
  <script>
    const log = document.getElementById("log");
    const field = document.getElementById("field");
    const cur = document.getElementById("cur");
    const cap = document.getElementById("cap");
    const narrative = document.getElementById("narrative");
    const narBig = narrative.querySelector(".big");
    const narSub = narrative.querySelector(".sub");
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const escapeHtml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function push(role, who, html) {
      const m = document.createElement("div");
      m.className = "msg " + role;
      m.innerHTML = '<div class="who"><span class="dot"></span>' + who + '</div><div class="body">' + html + "</div>";
      log.appendChild(m);
      log.scrollTop = log.scrollHeight;
      return m;
    }

    async function scrollTo(target, ms) {
      const start = log.scrollTop;
      const end = typeof target === "number" && target <= 1 ? (log.scrollHeight - log.clientHeight) * target : target;
      const t0 = performance.now();
      return new Promise((res) => {
        function step(now) {
          const p = Math.min(1, (now - t0) / ms);
          const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          log.scrollTop = start + (end - start) * e;
          p < 1 ? requestAnimationFrame(step) : res();
        }
        requestAnimationFrame(step);
      });
    }

    async function typeInput(text, cps = 26) {
      field.textContent = "";
      for (const ch of text) { field.textContent += ch; await sleep(1000 / cps); }
    }

    /** Stream an agent reply in like a CLI generating tokens: reveal the text in
     *  small chunks, auto-scrolling so the newest lines stay in view. */
    async function streamAgentText(text, cps = 1800) {
      const m = push("agent", "copilot", '<pre class="raw"></pre>');
      const pre = m.querySelector(".raw");
      const per = Math.max(3, Math.round(cps / 60));
      for (let i = 0; i < text.length; i += per) {
        pre.textContent = text.slice(0, i + per);
        log.scrollTop = log.scrollHeight;
        await sleep(16);
      }
      pre.textContent = text;
      log.scrollTop = log.scrollHeight;
      return m;
    }

    let thinkingEl = null;

    window.cli = {
      pushUser: (text) => push("user", "You", escapeHtml(text)),
      pushAgentText: (text) => push("agent", "copilot", '<pre class="raw">' + escapeHtml(text) + "</pre>"),
      streamAgentText,
      pushAgentHtml: (html) => push("agent", "copilot", html),
      submitInput: () => {
        const text = field.textContent.trim();
        field.textContent = "";
        if (text) push("user", "You", escapeHtml(text));
        return text;
      },
      thinking: (on) => {
        if (on) {
          if (thinkingEl) return;
          thinkingEl = document.createElement("div");
          thinkingEl.className = "thinking";
          thinkingEl.innerHTML = '<span class="spin"></span><span>Thinking&hellip;</span>';
          log.appendChild(thinkingEl);
          log.scrollTop = log.scrollHeight;
        } else if (thinkingEl) {
          thinkingEl.remove();
          thinkingEl = null;
        }
      },
      scrollTo,
      typeInput,
      clearInput: () => { field.textContent = ""; },
      hideCursor: () => { cur.style.display = "none"; },
      showCursor: () => { cur.style.display = "inline-block"; },
      caption: (text) => { cap.textContent = text; cap.style.opacity = text ? "1" : "0"; },
      narrate: (big, sub) => {
        if (!big) { narrative.style.opacity = "0"; return; }
        narBig.innerHTML = big;
        narSub.innerHTML = sub || "";
        narrative.style.opacity = "1";
      },
    };
  </script>
</body>
</html>
